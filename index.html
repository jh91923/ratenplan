<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ratenzahlungsplan</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2430;--muted:#667085;--line:#e4e7ec;--accent:#1f6feb;--accent-t:#fff;--warn:#b42318;--hl:#e8f1ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202a;--text:#e8edf3;--muted:#98a2b3;--line:#2a3441;--accent:#4c8dff;--accent-t:#0b1220;--warn:#ff8a80;--hl:#1b2a42}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202a;--text:#e8edf3;--muted:#98a2b3;--line:#2a3441;--accent:#4c8dff;--accent-t:#0b1220;--warn:#ff8a80;--hl:#1b2a42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{margin-top:14px;width:100%;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-t);border:0;border-radius:10px;padding:12px;cursor:pointer}
.err{color:var(--warn);margin-top:10px;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--hl);border-radius:10px;padding:10px 12px}
.stat span{display:block;font-size:.78rem;color:var(--muted)}
.stat b{font-size:1.05rem}
.wrap{overflow-x:auto;margin-top:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:.8rem;position:sticky;top:0;background:var(--card)}
tr.sof td{font-weight:600}
tr.last td{background:var(--hl);font-weight:700}
.note{color:var(--muted);font-size:.85rem;margin-top:10px}
.hide{display:none}
.row{display:flex;gap:8px;margin-top:14px}
.row button{margin-top:0;flex:1}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btns{display:flex;gap:8px}
.full{grid-column:1/-1}
h2{font-size:1rem;margin:0 0 10px}
.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.sec{display:flex;justify-content:space-between;align-items:center}
.sec button{width:auto;margin:0;padding:8px 12px;font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>Ratenzahlungsplan</h1>
<p class="sub">Berechnet Laufzeit und Ratenplan inklusive geringerer Schlussrate.</p>

<div class="card">
  <h2>Schuldner</h2>
  <div class="grid">
    <div class="full"><label for="name">Name des Schuldners</label><input id="name" type="text" autocomplete="name" placeholder="Vor- und Nachname"></div>
    <div class="full"><label for="street">Straße und Hausnummer</label><input id="street" type="text" autocomplete="street-address"></div>
    <div class="full"><label for="city">PLZ und Ort</label><input id="city" type="text" autocomplete="postal-code"></div>
  </div>
  <hr class="sep">
  <h2>Schuld und Rate</h2>
  <div class="grid">
    <div><label for="amount">Höhe der Schulden (€)</label><input id="amount" type="number" inputmode="decimal" min="0" step="0.01" value="5000"></div>
    <div><label for="rate">Monatliche Rate (€)</label><input id="rate" type="number" inputmode="decimal" min="0" step="0.01" value="300"></div>
    <div><label for="start">Beginn (erste Rate im Monat)</label><input id="start" type="month"></div>
    <div><label for="dfrom">Schulden entstanden von (Monat)</label><input id="dfrom" type="month"></div>
    <div><label for="dto">Schulden entstanden bis (Monat)</label><input id="dto" type="month"></div>
    <div><label for="sofort">Einmalzahlung (€) – optional</label><input id="sofort" type="number" inputmode="decimal" min="0" step="0.01"></div>
    <div><label for="sdate">Datum der Einmalzahlung</label><input id="sdate" type="date"></div>
  </div>
  <div class="row"><button id="go">Plan erstellen</button><button id="reset" class="ghost" type="button">Zurücksetzen</button></div>
  <div id="err" class="err"></div>
</div>

<div id="result" class="hide">
  <div class="card">
    <div class="stats" id="stats"></div>
    <p class="note" id="note"></p>
  </div>
  <div class="card">
    <div class="sec"><b>Ratenlaufplan</b><div class="btns"><button id="pdf">Als PDF speichern</button><button id="csv">CSV</button></div></div>
    <div class="wrap"><table>
      <thead><tr><th>Nr. / Monat</th><th>Rate</th><th>Restschuld</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="note" id="msg"></div>
  </div>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const eur = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const $ = id => document.getElementById(id);
let plan = [];
let sofortSkipped = false;

function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){ const [y,m,d] = iso.split('-'); return d + '.' + m + '.' + y; }

(function init(){
  const d = new Date();
  $('start').value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  $('sdate').value = todayISO();
})();

function monthLabel(y, m){
  return new Date(y, m, 1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});
}

function schuldZeitraum(){
  const a = $('dfrom').value, b = $('dto').value;
  const lbl = v => { const [y, m] = v.split('-').map(Number); return monthLabel(y, m - 1); };
  if (a && b) return a === b ? lbl(a) : lbl(a) + ' bis ' + lbl(b);
  if (a) return 'ab ' + lbl(a);
  if (b) return 'bis ' + lbl(b);
  return '';
}

function calc(){
  const err = $('err'); err.textContent = '';
  const debt = Math.round(parseFloat($('amount').value) * 100);
  const rate = Math.round(parseFloat($('rate').value) * 100);
  const sv = $('start').value;
  if (!(debt > 0)) return fail('Bitte eine Schuldenhöhe größer 0 eingeben.');
  if (!(rate > 0)) return fail('Bitte eine monatliche Rate größer 0 eingeben.');
  if (!sv) return fail('Bitte einen Beginn wählen.');
  if ($('dfrom').value && $('dto').value && $('dfrom').value > $('dto').value) return fail('Der Schuldzeitraum ist ungültig: „von“ liegt nach „bis“.');
  const [sy, sm] = sv.split('-').map(Number);

  const sofortRaw = $('sofort').value.trim();
  const sAmt = sofortRaw === '' ? 0 : Math.round(parseFloat(sofortRaw) * 100);
  const sDate = $('sdate').value;
  if (isNaN(sAmt) || sAmt < 0) return fail('Bitte eine gültige Einmalzahlung eingeben (0 oder höher).');
  if (sAmt > 0 && !sDate) return fail('Bitte ein Datum für die Einmalzahlung wählen.');

  plan = [];
  sofortSkipped = false;
  let rest = debt, k = 0, sofortDone = !(sAmt > 0);
  let sIdx = 0;
  if (!sofortDone) {
    const [y2, m2] = sDate.split('-').map(Number);
    sIdx = (y2 - sy) * 12 + (m2 - sm);   // Monatsabstand zum Ratenbeginn
  }
  while (rest > 0) {
    if (plan.length > 1300) return fail('Die Laufzeit übersteigt 100 Jahre. Bitte eine höhere Rate wählen.');
    if (!sofortDone && sIdx <= k) {
      // Einmalzahlung liegt vor (oder im selben Monat wie) der nächsten Rate
      const pay = Math.min(sAmt, rest);
      rest -= pay;
      sofortDone = true;
      plan.push({nr:0, sofort:true, label:'Einmalzahlung am ' + fmtDate(sDate), pay, rest});
    } else {
      const pay = Math.min(rate, rest);
      rest -= pay;
      plan.push({nr:++k, label:monthLabel(sy, sm - 1 + k - 1), pay, rest});
    }
  }
  if (!sofortDone) sofortSkipped = true;   // Schuld war bereits vor dem Zahlungsdatum beglichen
  render(debt, rate);
}

function fail(msg){
  $('err').textContent = msg;
  $('result').classList.add('hide');
  return false;
}

function render(debt, rate){
  const sof = plan.find(p => p.sofort);
  const raten = plan.filter(p => !p.sofort);
  const n = raten.length, last = raten[n-1], lastRow = plan.length - 1;
  const total = plan.reduce((s,p)=>s+p.pay,0);
  const full = n > 0 && last.pay === rate;
  const zr = schuldZeitraum();
  const stats = [
    ['Schulden', eur.format(debt/100)],
    ...(zr ? [['Schuldzeitraum', zr]] : []),
    ...(sof ? [['Einmalzahlung', eur.format(sof.pay/100) + ' am ' + sof.label.replace('Einmalzahlung am ','')]] : []),
    ['Anzahl Raten', n],
    ['Ratenzeitraum', n ? raten[0].label + ' – ' + last.label : '–'],
    ['Monatliche Rate', eur.format(rate/100)],
    ['Schlussrate', n ? eur.format(last.pay/100) : '–'],
    ['Gesamtzahlung', eur.format(total/100)]
  ];
  $('stats').innerHTML = stats.map(s => '<div class="stat"><span>'+s[0]+'</span><b>'+s[1]+'</b></div>').join('');
  const sofortLast = plan[lastRow].sofort;
  const sofDate = sof ? sof.label.replace('Einmalzahlung am ','') : '';
  const vor = sof ? 'Die Einmalzahlung von ' + eur.format(sof.pay/100) + ' am ' + sofDate + ' ist im Plan an der passenden Stelle berücksichtigt. ' : '';
  let text = n === 0
    ? 'Die Schuld wird vollständig durch die Einmalzahlung beglichen.'
    : sofortLast
      ? vor + n + ' Raten zu ' + eur.format(rate/100) + '; die Restschuld wird durch die Einmalzahlung beglichen.'
      : vor + (n === 1
        ? 'Die Restschuld wird mit einer einzigen Rate beglichen.'
        : full
          ? 'Die Schuld geht genau mit voller Rate auf – es gibt keine geringere Schlussrate.'
          : (n-1) + ' Raten zu ' + eur.format(rate/100) + ', danach eine Schlussrate von ' + eur.format(last.pay/100) + '.');
  if (sofortSkipped) text += ' Die Einmalzahlung entfällt, weil die Schuld vor dem gewählten Datum bereits beglichen ist.';
  $('note').textContent = text;
  $('rows').innerHTML = plan.map((p,i) =>
    '<tr class="'+(i===lastRow?'last':'')+(p.sofort?' sof':'')+'"><td>'+(p.sofort ? '' : p.nr+'. ')+p.label+(i===lastRow && !p.sofort ? ' (Schluss)':'')+'</td><td>'+eur.format(p.pay/100)+'</td><td>'+eur.format(p.rest/100)+'</td></tr>'
  ).join('');
  $('result').classList.remove('hide');
}

function save(data, filename){
  const msg = $('msg'); msg.textContent = '';
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(data);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (e) {
    msg.textContent = 'Die Datei konnte nicht gespeichert werden.';
  }
}

function eurP(c){ return (c/100).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' EUR'; }

function pdf(){
  if (!plan.length) return;
  if (!window.jspdf) { $('msg').textContent = 'Die PDF-Bibliothek konnte nicht geladen werden.'; return; }
  const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
  const L = 20, R = 190, cRate = 135;
  const name = $('name').value.trim(), street = $('street').value.trim(), city = $('city').value.trim();
  const sof = plan.find(p => p.sofort), raten = plan.filter(p => !p.sofort);
  const total = plan.reduce((s,p) => s + p.pay, 0), rate = raten.length ? raten[0].pay : 0, last = raten[raten.length-1];
  let y = 22;
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text('Ratenzahlungsplan', L, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(100);
  doc.text('Erstellt am ' + new Date().toLocaleDateString('de-DE'), R, y, {align:'right'});
  doc.setTextColor(0);
  y += 11;
  const addr = [name, street, city].filter(Boolean);
  if (addr.length) {
    doc.setFont('helvetica','bold'); doc.text('Schuldner', L, y); y += 5;
    doc.setFont('helvetica','normal');
    addr.forEach(t => { doc.text(t, L, y); y += 5; });
    y += 4;
  }
  const sum = [
    ['Gesamtschuld', eurP(total)],
    ...(schuldZeitraum() ? [['Schuldzeitraum', schuldZeitraum()]] : []),
    ...(sof ? [['Einmalzahlung', eurP(sof.pay) + ' am ' + sof.label.replace('Einmalzahlung am ','')]] : []),
    ['Monatliche Rate', raten.length ? eurP(rate) : '-'],
    ['Anzahl der Raten', String(raten.length)],
    ['Ratenzeitraum', raten.length ? raten[0].label + ' bis ' + last.label : '-'],
    ['Schlussrate', raten.length ? eurP(last.pay) : '-']
  ];
  sum.forEach(r => {
    doc.setFont('helvetica','bold'); doc.text(r[0], L, y);
    doc.setFont('helvetica','normal'); doc.text(r[1], L + 45, y);
    y += 6;
  });
  y += 6;
  const head = () => {
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Nr.', L, y); doc.text('Zahlung', L + 14, y);
    doc.text('Rate', cRate, y, {align:'right'}); doc.text('Restschuld', R, y, {align:'right'});
    y += 2; doc.setDrawColor(160); doc.line(L, y, R, y); y += 5.5;
    doc.setFont('helvetica','normal');
  };
  head();
  plan.forEach((p, i) => {
    if (y > 278) { doc.addPage(); y = 22; head(); }
    const isLast = i === plan.length - 1;
    if (isLast || p.sofort) { doc.setFillColor(isLast ? 232 : 243, isLast ? 241 : 243, isLast ? 255 : 243); doc.rect(L - 1, y - 4.8, R - L + 2, 6.8, 'F'); doc.setFont('helvetica','bold'); }
    doc.text(p.sofort ? 'S' : String(p.nr), L, y);
    doc.text(p.label + (isLast && !p.sofort ? ' (Schlussrate)' : ''), L + 14, y);
    doc.text(eurP(p.pay), cRate, y, {align:'right'});
    doc.text(eurP(p.rest), R, y, {align:'right'});
    if (isLast || p.sofort) doc.setFont('helvetica','normal');
    y += 7;
  });
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFontSize(9); doc.setTextColor(120);
    doc.text('Seite ' + i + ' von ' + pages, 105, 290, {align:'center'});
  }
  const fn = 'Ratenplan' + (name ? '_' + name.replace(/[^A-Za-z0-9äöüÄÖÜß-]+/g, '_') : '') + '.pdf';
  save(doc.output('blob'), fn);
}

function csv(){
  const f = c => (c/100).toFixed(2).replace('.',',');
  const lines = ['Nr;Monat;Rate;Restschuld'].concat(plan.map(p => [p.sofort ? 'S' : p.nr,p.label,f(p.pay),f(p.rest)].join(';')));
  const blob = new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv'});
  save(blob, 'ratenplan.csv');
}

function resetAll(){
  ['name','street','city','amount','rate','dfrom','dto','sofort'].forEach(id => { $(id).value = ''; });
  const d = new Date();
  $('start').value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  $('sdate').value = todayISO();
  plan = [];
  $('err').textContent = '';
  $('msg').textContent = '';
  $('rows').innerHTML = '';
  $('result').classList.add('hide');
  $('name').focus();
}

$('go').addEventListener('click', calc);
$('reset').addEventListener('click', resetAll);
$('csv').addEventListener('click', csv);
$('pdf').addEventListener('click', pdf);
document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') calc(); }));
calc();
</script>
</body>
</html>
